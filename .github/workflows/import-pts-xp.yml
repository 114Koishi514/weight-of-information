name: Import PTS XP v06 website
on:
  push:
    paths:
      - ".github/workflows/import-pts-xp.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified PTS XP v06 release
        shell: bash
        run: |
          set -euo pipefail
          url="https://pts2000-public-terminal.ornatedaisy1.chatgpt.site/downloads/PTS2000_Terminal_v06.zip"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 "$url" -o /tmp/pts-xp-v06.zip
          echo "ac37f4124fdd004b2d6b95d2193da58c9727323edf55db8c46b415d3c064c43f  /tmp/pts-xp-v06.zip" | sha256sum --check
          mkdir -p /tmp/pts-xp-release
          unzip -q /tmp/pts-xp-v06.zip -d /tmp/pts-xp-release
          test -f /tmp/pts-xp-release/PTS2000_Terminal/dist/index.html
      - name: Import source and GitHub Pages website separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pts-xp docs/pts-xp
          cp -a /tmp/pts-xp-release/PTS2000_Terminal/. pts-xp/
          cp -a /tmp/pts-xp-release/PTS2000_Terminal/dist/. docs/pts-xp/
          printf 'PTS XP v06 — published at /weight-of-information/pts-xp/\n' > docs/pts-xp/RELEASE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pts-xp docs/pts-xp
          if ! git diff --cached --quiet; then
            git commit -m "Publish PTS XP v06 alongside the original website"
            git push
          fi
